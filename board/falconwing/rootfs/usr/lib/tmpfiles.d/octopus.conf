# Persistent Octopus state (alarms, last FM station, podcasts...) on the
# persistent /var: the apps' user's (files from before it existed, root's,
# handed over at boot).
d /var/lib/octopus 0755 octopus octopus -
Z /var/lib/octopus - octopus octopus -

# The read-only root's /etc settings live here (see post-build.sh);
# octopus-config.service fills in the rest from the FAT partition.
d /run/octopus-config 0755 root root -
C /run/octopus-config/shadow - - - - /etc/shadow.default
L /run/octopus-config/localtime - - - - /usr/share/zoneinfo/Etc/UTC

# Installed app bundles (octopus-install): root's, run as the apps' user.
d /var/apps 0755 root root -

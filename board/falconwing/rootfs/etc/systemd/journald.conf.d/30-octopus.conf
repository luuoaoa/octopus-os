# 64 MB and an SD card to spare: keep the journal in RAM and small.
# Two 512 KB files (journald's smallest), so rotating never drops all
# the history at once; at the usual few hundred lines an hour that's
# about a day of it. Debug messages aren't kept.
[Journal]
Storage=volatile
RuntimeMaxUse=1M
RuntimeMaxFileSize=512K
MaxLevelStore=info

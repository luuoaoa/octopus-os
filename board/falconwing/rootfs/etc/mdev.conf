# mdev rules for falconwing. mdev runs as /proc/sys/kernel/hotplug
# (set in /etc/init.d/S00devfs) because 2.6.28 has no devtmpfs.
null		root:root 666 @chmod 666 $MDEV
zero		root:root 666
full		root:root 666
random		root:root 444
urandom		root:root 444
kmem		root:root 640
mem		root:root 640
console		root:tty 600 @chmod 600 $MDEV
ptmx		root:tty 666
pty.*		root:tty 660
tty		root:tty 666
tty[0-9]*	root:tty 660
ttyAM[0-9]*	root:root 660
ttyUSB[0-9]*	root:root 660
watchdog	root:root 600
rtc0		root:root 660 =rtc0 @ln -sf rtc0 rtc
mmcblk.*	root:disk 660
sd[a-z].*	root:disk 660
# 2.6.28 sends no DEVNAME in uevents, so mdev only sees the flat sysfs
# name; move ALSA and input nodes into their subdirectories explicitly.
event[0-9]+	root:root 640 =input/
mice		root:root 640 =input/
mouse[0-9]+	root:root 640 =input/
pcm.*		root:audio 660 =snd/
control.*	root:audio 660 =snd/
timer		root:audio 660 =snd/
seq		root:audio 660 =snd/
i2c-[0-9]+	root:root 600
fb[0-9]		root:video 660
# Autoload drivers for anything that announces a MODALIAS (USB wifi,
# USB ethernet, usb-storage, ...). Firmware requests are handled by
# mdev itself (CONFIG_FEATURE_MDEV_LOAD_FIRMWARE) from /lib/firmware.
$MODALIAS=.*	root:root 660 @modprobe -q "$MODALIAS"

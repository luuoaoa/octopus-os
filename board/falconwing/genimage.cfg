# Chumby One (falconwing) SD card.
#
#   p1  0x53   stock boot partition (boot stream + config block), with our
#              zImage + DTB written into the krnA slot by post-image.sh;
#              otherwise byte-for-byte the stock partition. Must stay at
#              sector 4: the config block records that offset, and the
#              i.MX23 boot ROM finds the boot stream by the 0x53 type.
#   p2  ext4   the carrier (root=/dev/mmcblk0p2 init=/sbin/init-ram from
#              the DT bootargs): early boot, rootfs.squashfs - mounted
#              read-only as the root - and /data/var, the persistent /var.
#   p3  FAT16  "CHUMBY" config partition (network-config, user-data,
#              authorized_keys), editable from any PC. Mounted ro at /boot.
#              (On the stock card p3 was the slot-B rootfs; slot B is unused.)

image config.vfat {
  vfat {
    extraargs = "-n CHUMBY"
    files = {
      "config/README.txt",
      "config/network-config",
      "config/user-data"
    }
  }
  size = 32M
}

image sdcard.img {
  hdimage {
    partition-table-type = "mbr"
    align = 512
  }

  partition boot {
    partition-type = 0x53
    offset = 2048
    image = "falconwing-boot.img"
  }

  partition rootfs {
    partition-type = 0x83
    offset = 16M
    image = "carrier.ext4"
  }

  partition config {
    partition-type = 0x0E
    image = "config.vfat"
  }
}

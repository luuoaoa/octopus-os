# WirePlumber keeps its state (default sink, volumes, profiles) under
# $XDG_STATE_HOME/wireplumber; the pipewire user's HOME is /, so that
# would be /.local/state - unwritable. /var/lib/wireplumber instead,
# created by systemd for the unit's user. (From pi-radio.)
[Service]
StateDirectory=wireplumber
Environment=XDG_STATE_HOME=/var/lib

// (A Pi's copy.) shairport-sync: an AirPlay 1 speaker named after the host ("chumby",
// "raspad"), for iPhones, iPads and Macs. See the AirPlay app
// (package/chumby-apps/src/airplay.c) and usr/libexec/chumby-airplay-hook.

general = {
	name = "%H";
	mdns_backend = "tinysvcmdns";	// built in: no avahi on the image
	output_backend = "alsa";
	interpolation = "basic";	// light on the CPU
	// Half a second queued (0.2 by default).
	audio_backend_buffer_desired_length_in_seconds = 0.5;
	// The phone's volume slider: shairport-sync turns the stream down.
	volume_range_db = 50;
};

sessioncontrol = {
	// Before the sound card opens: whatever else plays stops (chumby-audio),
	// and the AirPlay app comes up. Waited for, so the card is free.
	run_this_before_play_begins = "/usr/libexec/chumby-airplay-hook begin";
	run_this_after_play_ends = "/usr/libexec/chumby-airplay-hook end";
	wait_for_completion = "yes";
	// Another phone may take over.
	allow_session_interruption = "yes";
	session_timeout = 20;
};

alsa = {
	// PipeWire (and the speakers' EQ); the phone's volume in software.
	// (The Chumby's copy, board/falconwing-mainline, uses its codec.)
	output_device = "default";
};

metadata = {
	enabled = "yes";
	include_cover_art = "yes";
	// Read by chumby-airplay-meta, for the app.
	pipe_name = "/run/shairport-sync/metadata";
	pipe_timeout = 5000;
};

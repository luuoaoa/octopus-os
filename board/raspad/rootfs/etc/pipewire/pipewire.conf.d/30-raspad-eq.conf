# PipeWire filter-chain sink for the RasPad's speakers (from pifansrf's
# pi-radio rt5645 chain).
#
#   players -> "raspad-eq" sink (the default) -> bankstown bass -> EQ
#           -> HDMI sink -> the RasPad's board and speakers
#
# eq-toggle switches the default sink between this chain and the bare
# HDMI sink (bypass), and back.
#
# The EQ: measure the speakers with Room EQ Wizard, export its filters as
# text (File > Export > Filter Settings as text), then
#
#   bin/rew-to-pipewire.py --bass rew-export.txt > snippet.conf
#
# and replace the filter.graph block below with the snippet (bankstown
# first, then the EQ), and `systemctl restart pipewire wireplumber`.
# Until then it is tuned by ear (below): no measurement of the RasPad's
# speakers yet (pi-radio's EQ was measured for a different speaker).

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "RasPad speakers (bass + EQ)"
            media.name       = "RasPad speakers (bass + EQ)"
            audio.position   = [ FL FR ]

            capture.props = {
                node.name        = "raspad-eq"
                node.description = "RasPad speakers (bass + EQ)"
                media.class      = Audio/Sink
                # Above any ALSA sink: WirePlumber makes it the default.
                priority.session = 2100
                priority.driver  = 2100
                audio.position   = [ FL FR ]
            }
            playback.props = {
                node.name        = "raspad-eq-out"
                node.description = "RasPad speakers (bass + EQ) output"
                node.passive     = true
                # The first HDMI port's sink (the RasPad's), named so by
                # /etc/wireplumber/wireplumber.conf.d/50-raspad-speakers.conf.
                # (It can appear after this chain: the link waits for it.)
                target.object    = "raspad-speakers"
                audio.position   = [ FL FR ]
            }

            filter.graph = {
                # By ear, until the speakers are measured (no mic yet):
                # bankstown (bass the ear fills in from harmonics, the
                # cones below 120 Hz spared), then -4 dB of headroom,
                # +4 dB below ~150 Hz and -1.5 dB above 5 kHz. More
                # than that (+8 dB, a 90 Hz peak) overdrove the drivers:
                # boomy and muddy.
                nodes = [
                    { type = lv2 name = bass plugin = "https://chadmed.au/bankstown"
                        control = {
                            bypass     = 0.0
                            amt        = 1.0
                            sat_second = 1.65
                            sat_third  = 2.2
                            blend      = 1.0
                            floor      = 20.0
                            ceil       = 200.0
                            final_hp   = 120.0
                        } }
                    { type = builtin name = pre_L label = mixer control = { "Gain 1" = 0.63 } }
                    { type = builtin name = eq_L_1 label = bq_lowshelf control = { Freq = 150.0 Q = 0.7 Gain = 4.0 } }
                    { type = builtin name = eq_L_2 label = bq_highshelf control = { Freq = 5000.0 Q = 0.7 Gain = -1.5 } }
                    { type = builtin name = pre_R label = mixer control = { "Gain 1" = 0.63 } }
                    { type = builtin name = eq_R_1 label = bq_lowshelf control = { Freq = 150.0 Q = 0.7 Gain = 4.0 } }
                    { type = builtin name = eq_R_2 label = bq_highshelf control = { Freq = 5000.0 Q = 0.7 Gain = -1.5 } }
                ]
                links = [
                    { output = "bass:out_l" input = "pre_L:In 1" }
                    { output = "pre_L:Out" input = "eq_L_1:In" }
                    { output = "eq_L_1:Out" input = "eq_L_2:In" }
                    { output = "bass:out_r" input = "pre_R:In 1" }
                    { output = "pre_R:Out" input = "eq_R_1:In" }
                    { output = "eq_R_1:Out" input = "eq_R_2:In" }
                ]
                inputs  = [ "bass:in_l"  "bass:in_r"  ]
                outputs = [ "eq_L_2:Out" "eq_R_2:Out" ]
            }
        }
    }
]

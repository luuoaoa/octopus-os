# PipeWire filter-chain sink for the RasPad's speakers (from pifansrf's
# pi-radio rt5645 chain).
#
#   players -> "raspad-eq" sink (the default) -> bankstown bass -> EQ
#           -> HDMI sink -> the RasPad's board and speakers
#
# eq-toggle switches the default sink between this chain and the bare
# HDMI sink (bypass), and back.
#
# The EQ: measure the speakers with Room EQ Wizard, export its filters as
# text (File > Export > Filter Settings as text), then
#
#   bin/rew-to-pipewire.py --bass rew-export.txt > snippet.conf
#
# and replace the filter.graph block below with the snippet (bankstown
# first, then the EQ), and `systemctl restart pipewire wireplumber`.
# Until then the chain is bankstown alone: no measurement of the RasPad's
# speakers yet (pi-radio's EQ was measured for a different speaker).

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "RasPad speakers (bass + EQ)"
            media.name       = "RasPad speakers (bass + EQ)"
            audio.position   = [ FL FR ]

            capture.props = {
                node.name        = "raspad-eq"
                node.description = "RasPad speakers (bass + EQ)"
                media.class      = Audio/Sink
                # Above any ALSA sink: WirePlumber makes it the default.
                priority.session = 2100
                priority.driver  = 2100
                audio.position   = [ FL FR ]
            }
            playback.props = {
                node.name        = "raspad-eq-out"
                node.description = "RasPad speakers (bass + EQ) output"
                node.passive     = true
                # The first HDMI port's sink (the RasPad's), as WirePlumber
                # names it; "wpctl status" lists the names.
                target.object    = "alsa_output.platform-fef00700.hdmi.hdmi-stereo"
                node.dont-reconnect = true
                audio.position   = [ FL FR ]
            }

            filter.graph = {
                # bankstown: psychoacoustic bass. It adds the 2nd and 3rd
                # harmonics of what's below the speakers' roll-off, which
                # the ear hears as the missing fundamental. The Pi 0W on
                # pi-radio had to run it cut down (sat_third = 0); a
                # Pi 4 has the headroom for the reference tuning
                # (chadmed.au's GPD Pocket 4: 1.65 / 2.20).
                nodes = [
                    { type = lv2 name = bass plugin = "https://chadmed.au/bankstown"
                        control = {
                            bypass     = 0.0
                            amt        = 0.9
                            sat_second = 1.65
                            sat_third  = 2.20
                            blend      = 1.0
                            floor      = 20.0
                            ceil       = 200.0
                            final_hp   = 120.0
                        } }
                    # (EQ nodes from bin/rew-to-pipewire.py go here.)
                ]
                links = [
                ]
                inputs  = [ "bass:in_l"  "bass:in_r"  ]
                outputs = [ "bass:out_l" "bass:out_r" ]
            }
        }
    }
]

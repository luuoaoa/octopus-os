# PipeWire filter-chain sink for the RasPad's speakers (from pifansrf's
# pi-radio rt5645 chain).
#
#   players -> "raspad-eq" sink (the default) -> bankstown bass -> pre-gain
#           -> low shelf -> 10 peaking filters -> high shelf -> low-pass
#           -> HDMI sink -> the RasPad's board and speakers
#
# Every stage starts neutral (bass bypassed, gains 0 dB, the low-pass at
# 20 kHz): chumby-sound sets them, live, from Settings > Sound (the bass
# enhancer's level, an EQ: a preset or custom, from eq.txt on the config
# partition - Room EQ Wizard's filter export). A filter's type can't change
# while it runs, hence fixed slots: one low shelf, 10 peaking, one high
# shelf per channel.

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "RasPad speakers (bass + EQ)"
            media.name       = "RasPad speakers (bass + EQ)"
            audio.position   = [ FL FR ]

            capture.props = {
                node.name        = "raspad-eq"
                node.description = "RasPad speakers (bass + EQ)"
                media.class      = Audio/Sink
                # Above any ALSA sink: WirePlumber makes it the default.
                priority.session = 2100
                priority.driver  = 2100
                audio.position   = [ FL FR ]
            }
            playback.props = {
                node.name        = "raspad-eq-out"
                node.description = "RasPad speakers (bass + EQ) output"
                node.passive     = true
                # The first HDMI port's sink (the RasPad's), named so by
                # /etc/wireplumber/wireplumber.conf.d/50-raspad-speakers.conf.
                # (It can appear after this chain: the link waits for it.)
                target.object    = "raspad-speakers"
                audio.position   = [ FL FR ]
            }

            filter.graph = {
                nodes = [
                    { type = lv2 name = bass plugin = "https://chadmed.au/bankstown"
                        control = {
                            bypass     = 1.0
                            amt        = 1.5
                            sat_second = 1.65
                            sat_third  = 2.2
                            blend      = 1.0
                            floor      = 20.0
                            ceil       = 200.0
                            final_hp   = 120.0
                        } }
                    { type = builtin name = pre_L label = mixer control = { "Gain 1" = 1.0 } }
                    { type = builtin name = ls_L label = bq_lowshelf control = { Freq = 100.0 Q = 0.7 Gain = 0.0 } }
                    { type = builtin name = pk_L_1 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_L_2 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_L_3 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_L_4 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_L_5 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_L_6 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_L_7 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_L_8 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_L_9 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_L_10 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = hs_L label = bq_highshelf control = { Freq = 8000.0 Q = 0.7 Gain = 0.0 } }
                    { type = builtin name = lp_L label = bq_lowpass control = { Freq = 20000.0 Q = 0.7 Gain = 0.0 } }
                    { type = builtin name = pre_R label = mixer control = { "Gain 1" = 1.0 } }
                    { type = builtin name = ls_R label = bq_lowshelf control = { Freq = 100.0 Q = 0.7 Gain = 0.0 } }
                    { type = builtin name = pk_R_1 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_R_2 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_R_3 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_R_4 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_R_5 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_R_6 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_R_7 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_R_8 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_R_9 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = pk_R_10 label = bq_peaking control = { Freq = 1000.0 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = hs_R label = bq_highshelf control = { Freq = 8000.0 Q = 0.7 Gain = 0.0 } }
                    { type = builtin name = lp_R label = bq_lowpass control = { Freq = 20000.0 Q = 0.7 Gain = 0.0 } }
                ]
                links = [
                    { output = "bass:out_l" input = "pre_L:In 1" }
                    { output = "pre_L:Out" input = "ls_L:In" }
                    { output = "ls_L:Out" input = "pk_L_1:In" }
                    { output = "pk_L_1:Out" input = "pk_L_2:In" }
                    { output = "pk_L_2:Out" input = "pk_L_3:In" }
                    { output = "pk_L_3:Out" input = "pk_L_4:In" }
                    { output = "pk_L_4:Out" input = "pk_L_5:In" }
                    { output = "pk_L_5:Out" input = "pk_L_6:In" }
                    { output = "pk_L_6:Out" input = "pk_L_7:In" }
                    { output = "pk_L_7:Out" input = "pk_L_8:In" }
                    { output = "pk_L_8:Out" input = "pk_L_9:In" }
                    { output = "pk_L_9:Out" input = "pk_L_10:In" }
                    { output = "pk_L_10:Out" input = "hs_L:In" }
                    { output = "hs_L:Out" input = "lp_L:In" }
                    { output = "bass:out_r" input = "pre_R:In 1" }
                    { output = "pre_R:Out" input = "ls_R:In" }
                    { output = "ls_R:Out" input = "pk_R_1:In" }
                    { output = "pk_R_1:Out" input = "pk_R_2:In" }
                    { output = "pk_R_2:Out" input = "pk_R_3:In" }
                    { output = "pk_R_3:Out" input = "pk_R_4:In" }
                    { output = "pk_R_4:Out" input = "pk_R_5:In" }
                    { output = "pk_R_5:Out" input = "pk_R_6:In" }
                    { output = "pk_R_6:Out" input = "pk_R_7:In" }
                    { output = "pk_R_7:Out" input = "pk_R_8:In" }
                    { output = "pk_R_8:Out" input = "pk_R_9:In" }
                    { output = "pk_R_9:Out" input = "pk_R_10:In" }
                    { output = "pk_R_10:Out" input = "hs_R:In" }
                    { output = "hs_R:Out" input = "lp_R:In" }
                ]
                inputs  = [ "bass:in_l"  "bass:in_r"  ]
                outputs = [ "lp_L:Out" "lp_R:Out" ]
            }
        }
    }
]

# RasPad: every ALSA player plays through PipeWire (the system-wide daemon,
# /run/pipewire/pipewire-0): "default" (the alarm tone) and "chumby" (what
# chumby-stream opens) both go to PipeWire's default sink - the
# "raspad-eq" filter chain (bass + EQ for the speakers, see
# /etc/pipewire/pipewire.conf.d/30-raspad-eq.conf; chumby-sound sets it).
# They mix there, so the alarm can sound over the radio.
#
# The control "Master" (what libchumby's volume drives) is the default
# sink's volume.

pcm.!default {
	type pipewire
	playback_node "-1"
	capture_node "-1"
	hint {
		show on
		description "PipeWire"
	}
}

pcm.chumby {
	type pipewire
	playback_node "-1"
	capture_node "-1"
}

ctl.!default {
	type pipewire
}

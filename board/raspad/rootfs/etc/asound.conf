# RasPad: sound goes out over HDMI to the RasPad's board and its speakers
# (its own volume buttons set the amplifier). The Pi's HDMI has no volume
# control of its own, so a soft one ("Master", what libchumby looks for)
# sits in front; "chumby" (what chumby-stream opens) and "default" both
# go through it, resampled and converted as needed.
#
# For the 3.5 mm jack instead, change the slave to "plughw:CARD=Headphones".

pcm.chumby_vol {
	type softvol
	slave.pcm "hdmi:CARD=vc4hdmi0,DEV=0"
	control {
		name "Master"
		card vc4hdmi0
	}
	min_dB -50.0
	max_dB 0.0
}

pcm.chumby {
	type plug
	slave.pcm "chumby_vol"
}

pcm.!default chumby

ctl.!default {
	type hw
	card vc4hdmi0
}

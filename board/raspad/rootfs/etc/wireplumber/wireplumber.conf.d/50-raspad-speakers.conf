# The Pi 4's first HDMI port (its controller at fef00700) feeds the
# RasPad's board and speakers. WirePlumber would name its sink after the
# sysfs path and ALSA card number ("alsa_output._sys_devices_platform_soc_
# fef00700.hdmi_sound_card0.hdmi-stereo"), and the card number can move;
# give it a fixed name for the EQ chain to target (30-raspad-eq.conf).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*fef00700[.]hdmi.*" }
    ]
    actions = {
      update-props = {
        node.name        = "raspad-speakers"
        node.description = "RasPad speakers (HDMI, no EQ)"
      }
    }
  }
]

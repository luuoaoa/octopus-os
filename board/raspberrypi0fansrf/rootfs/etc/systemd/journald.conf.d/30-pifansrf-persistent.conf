[Journal]
# Persist the journal to /var/log/journal/ (ext4) instead of the
# default volatile /run/log/journal (tmpfs, lost at reboot).
# Storage=persistent makes journald mkdir the path itself on first
# start — no separate tmpfiles/oneshot needed.
Storage=persistent

# Cap usage so a chatty service can't fill the 512 MiB /var partition.
# 64 MiB ceiling leaves room for alsa/wireplumber/dropbear/onlyfansd
# state and ext4 reservations; SystemMaxFileSize=8M keeps individual
# files small enough that rotation kicks in early on a Pi that may
# only run for a few weeks between writes.
SystemMaxUse=64M
SystemMaxFileSize=8M
MaxRetentionSec=2week

# systemd-resolved binds UDP/5353 by default to act as an mDNS responder,
# which collides with avahi-daemon (the host's real mDNS publisher; see
# avahi/avahi-daemon.service). With both bound via SO_REUSEPORT the kernel
# load-balances inbound queries between them and resolved answers nothing
# for service types it doesn't know. Keep resolved for DNS, just stop it
# from owning the mDNS port.
[Resolve]
MulticastDNS=no

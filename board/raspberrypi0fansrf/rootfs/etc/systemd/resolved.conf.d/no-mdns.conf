# systemd-resolved binds UDP/5353 by default to act as an mDNS responder.
# That collides with libmdns inside onlyfansd: inbound HAP queries get
# routed to whichever process the kernel picks (often resolved), and
# resolved doesn't know about the _hap._tcp service so it answers nothing.
# Keep resolved for DNS, just stop it from owning the mDNS port.
[Resolve]
MulticastDNS=no

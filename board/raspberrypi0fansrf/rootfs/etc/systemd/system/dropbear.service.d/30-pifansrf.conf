[Service]
# We've repointed /etc/dropbear at /var/lib/dropbear (see post-build.sh)
# so host keys persist on the ext4 partition instead of being regenerated
# every boot in /var/run. /var is freshly mkfs'd on first boot, so the
# directory needs to exist before dropbearmulti opens its keyfiles —
# StateDirectory creates it (and re-creates if missing) with mode 0700.
StateDirectory=dropbear
StateDirectoryMode=0700

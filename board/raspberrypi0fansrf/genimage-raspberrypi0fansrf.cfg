image boot.vfat {
  vfat {
    files = {
      "bcm2708-rpi-zero-w.dtb",
      "rpi-firmware/bootcode.bin",
      "rpi-firmware/cmdline.txt",
      "rpi-firmware/config.txt",
      "rpi-firmware/fixup.dat",
      "rpi-firmware/start.elf",
      "rpi-firmware/overlays",
      "zImage",
      "rootfs.cpio.lz4"
    }
  }
  size = 512M
}

# sdcard.img is just the FAT partition. The /var ext4 partition is created
# on first boot by create-var-partition.service (uses parted) and formatted
# by systemd-makefs via the x-systemd.makefs fstab option. This way reflashing
# the image doesn't touch p2 — persistent state survives.
image sdcard.img {
  hdimage {
  }

  partition boot {
    partition-type = 0xC
    bootable = "true"
    image = "boot.vfat"
  }
}

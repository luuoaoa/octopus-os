image boot.vfat {
  vfat {
    files = {
      "bcm2708-rpi-zero-w.dtb",
      "rpi-firmware/bootcode.bin",
      "rpi-firmware/cmdline.txt",
      "rpi-firmware/config.txt",
      "rpi-firmware/fixup.dat",
      "rpi-firmware/start.elf",
      "rpi-firmware/overlays",
      "zImage",
      "rootfs.cpio.gz"
    }
  }
  size = 128M
}

# Empty ext4 partition mounted at /var on the Pi for persistent state.
# Built blank here; systemd's tmpfiles.d/var.conf recreates the standard
# /var/{lib,log,cache,spool} skeleton on first mount, services then create
# their own subdirs lazily.
image var.ext4 {
  ext4 {
  }
  size = 256M
}

image sdcard.img {
  hdimage {
  }

  partition boot {
    partition-type = 0xC
    bootable = "true"
    image = "boot.vfat"
  }

  partition var {
    partition-type = 0x83
    image = "var.ext4"
  }
}

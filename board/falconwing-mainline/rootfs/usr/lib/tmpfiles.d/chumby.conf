# Persistent Chumby state (alarms, last FM station, podcasts...) on the
# persistent /var: the apps' user's (files from before it existed, root's,
# handed over at boot).
d /var/lib/chumby 0755 chumby chumby -
Z /var/lib/chumby - chumby chumby -

# The read-only root's /etc settings live here (see post-build.sh);
# chumby-config.service fills in the rest from the FAT partition.
d /run/chumby-config 0755 root root -
C /run/chumby-config/shadow - - - - /etc/shadow.default
L /run/chumby-config/localtime - - - - /usr/share/zoneinfo/Etc/UTC

# Off unless it's been turned on: in Settings (Network), or with "ssh: true"
# in the config partition's user-data. sdcard-config-apply (octopus-config)
# marks it on every boot; the Settings app starts and stops it through
# octopus-setting.
[Unit]
ConditionPathExists=/run/octopus-config/ssh-on
After=octopus-config.service

# Host keys live in /var/lib/dropbear (persistent; /etc/dropbear links
# there, see post-build.sh), so they survive the RAM root.
[Service]
StateDirectory=dropbear
StateDirectoryMode=0700

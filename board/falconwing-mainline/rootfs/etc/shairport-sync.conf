// shairport-sync: an AirPlay 1 speaker named after the host ("octopus",
// "raspad"), for iPhones, iPads and Macs. See the AirPlay app
// (package/octopus-apps/src/airplay.c) and usr/libexec/octopus-airplay-hook.

general = {
	name = "%H";
	mdns_backend = "tinysvcmdns";	// built in: no avahi on the image
	output_backend = "alsa";
	interpolation = "basic";	// light on the Chumby's CPU
	// A second queued at the sound card (0.2 by default): rides out the
	// Chumby's busy moments (a cover being decoded) without underruns.
	audio_backend_buffer_desired_length_in_seconds = 1.0;
	// The phone's volume slider: shairport-sync turns the stream down.
	volume_range_db = 50;
};

sessioncontrol = {
	// Before the sound card opens: whatever else plays stops (octopus-audio),
	// and the AirPlay app comes up. Waited for, so the card is free.
	run_this_before_play_begins = "/usr/libexec/octopus-airplay-hook begin";
	run_this_after_play_ends = "/usr/libexec/octopus-airplay-hook end";
	wait_for_completion = "yes";
	// Another phone may take over.
	allow_session_interruption = "yes";
	session_timeout = 20;
};

alsa = {
	// The codec. (A Pi has its own copy of this file: PipeWire and the
	// speakers' EQ, volume in software.)
	output_device = "default";
	// The phone's volume on the codec's own control (the one the UI's
	// volume is), not by scaling every sample in software: that work, and
	// its dither, cost the Chumby's ARM9 (no FPU) audible underruns.
	mixer_control_name = "DAC";
	// As the codec takes it: no conversion on the way.
	output_format = "S16";
	output_rate = 44100;
};

metadata = {
	enabled = "yes";
	include_cover_art = "yes";
	// Read by octopus-airplay-meta, for the app.
	pipe_name = "/run/shairport-sync/metadata";
	pipe_timeout = 5000;
};

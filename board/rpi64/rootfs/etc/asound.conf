# RasPad: every ALSA player plays through PipeWire (the system-wide daemon,
# /run/pipewire/pipewire-0): "default" (the alarm tone) and "octopus" (what
# octopus-stream opens) both go to PipeWire's default sink - the
# "raspad-eq" filter chain (bass + EQ for the speakers, see
# /etc/pipewire/pipewire.conf.d/30-raspad-eq.conf; octopus-sound sets it).
# They mix there, so the alarm can sound over the radio.
#
# The control "Master" (what liboctopus's volume drives) is the default
# sink's volume.

pcm.!default {
	type pipewire
	playback_node "-1"
	capture_node "-1"
	hint {
		show on
		description "PipeWire"
	}
}

pcm.octopus {
	type pipewire
	playback_node "-1"
	capture_node "-1"
}

ctl.!default {
	type pipewire
}

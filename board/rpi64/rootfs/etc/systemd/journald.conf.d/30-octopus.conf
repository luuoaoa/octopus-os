# (Replaces the Chumby's RAM-only journal.) A Pi 4 has the RAM and a
# writable root: keep the journal on the card, so a boot that fails can be
# read afterwards, here (journalctl -b -1) or with the card in another
# machine (journalctl -D <root>/var/log/journal).
[Journal]
Storage=persistent
SystemMaxUse=32M
MaxLevelStore=info

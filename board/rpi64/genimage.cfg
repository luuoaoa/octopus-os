# The Pi's boot FAT (firmware for every model, config.txt, cmdline.txt,
# the kernel, every model's DTB; and the user's network-config /
# user-data / authorized_keys), then the root. post-image.sh fills in the
# file list (the placeholder below) from what the build made.
image boot.vfat {
	vfat {
		label = "RPI64"
		files = {
#BOOT_FILES#
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}

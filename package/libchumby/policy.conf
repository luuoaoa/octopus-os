# Chumby system policy, read by every libchumby app and the shell
# (re-read every 30 s, no restart needed).

# Night mode window (local time). Night mode is a darker, warm, low-glare
# variant of the always-dark theme, and the shell dims the backlight.
night_start = 19:00
night_end = 07:00

# auto (follow the window above), day or night.
mode = auto

# Backlight for each mode (percent) until the brightness is set in the
# popup: from then on, what was last set in each mode (kept in
# /var/lib/chumby/brightness).
day_brightness = 80
night_brightness = 20

# (The power button turns the screen on and off; nothing else does, but
# a ringing alarm, which turns it on.)

# The screen saver after 5 minutes without input (not over the clock): a
# program in /usr/lib/chumby/savers, or none.
saver = toasters

# Alarms (set in the Clock app): snooze length, and the volume an alarm
# raises the speaker to if it's lower (percent).
snooze_minutes = 9
alarm_volume = 60

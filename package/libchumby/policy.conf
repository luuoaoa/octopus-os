# Chumby system policy, read by every libchumby app and the shell
# (re-read every 30 s, no restart needed).

# Night mode window (local time). Night mode is a darker, warm, low-glare
# variant of the always-dark theme, and the shell dims the backlight.
night_start = 19:00
night_end = 07:00

# auto (follow the window above), day or night.
mode = auto

# Backlight the shell applies when switching into each mode (percent).
day_brightness = 80
night_brightness = 20

# Screen completely off (backlight powered down) in this window. The snooze
# button lights it for wake_seconds, a ringing alarm keeps it on, and
# touches on the dark screen are ignored. Set start = end to never blank.
screen_off_start = 21:00
screen_off_end = 07:00
wake_seconds = 10

# Alarms (set in the Clock app): snooze length, and the volume an alarm
# raises the speaker to if it's lower (percent).
snooze_minutes = 9
alarm_volume = 60

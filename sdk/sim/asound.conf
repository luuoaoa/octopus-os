# The simulator's sound card: none. What the players play
# (octopus-stream opens "octopus", the alarm tone "default") goes, as
# 48 kHz 16-bit stereo, into a FIFO the PC plays from (octopus-app sim:
# pw-cat, paplay or aplay). The FIFO also keeps time: a player's writes
# wait while the PC's player hasn't taken the last ones, as a real card's
# would. ("null" under it only takes the samples ALSA hands it.)
pcm.sim_fifo {
	type file
	slave.pcm "null"
	file "/run/host-sound/pcm"
	format "raw"
}

pcm.!default {
	type plug
	slave {
		pcm "sim_fifo"
		format S16_LE
		rate 48000
		channels 2
	}
}

pcm.octopus {
	type plug
	slave {
		pcm "sim_fifo"
		format S16_LE
		rate 48000
		channels 2
	}
}
